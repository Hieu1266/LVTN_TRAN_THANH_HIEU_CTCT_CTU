name: Build and Deploy to K8s

on:
  push:
    branches:
      - main
    paths:
      - 'backend/service/**'
      - 'frontend/**'
      - 'k8s/**'
      - '.github/workflows/**'

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  # ==========================================
  # JOB 1: Build & Push 4 Backend Services
  # ==========================================
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - course_service
          - learning_progress_service
          - quiz_exam_service
          - user_service
          - config_service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/service/${{ matrix.service }}
          file: ./backend/service/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ==========================================
  # JOB 2: Build & Push Next.js Frontend
  # ==========================================
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            NEXT_PUBLIC_FRONTEND=${{ secrets.NEXT_PUBLIC_FRONTEND }}
            NEXT_PUBLIC_USER_BACKEND_URL=${{ secrets.NEXT_PUBLIC_USER_BACKEND_URL }}
            NEXT_PUBLIC_COURSE_BACKEND_URL=${{ secrets.NEXT_PUBLIC_COURSE_BACKEND_URL }}
            NEXT_PUBLIC_EXAM_BACKEND_URL=${{ secrets.NEXT_PUBLIC_EXAM_BACKEND_URL }}
            NEXT_PUBLIC_PROGRESS_BACKEND_URL=${{ secrets.NEXT_PUBLIC_PROGRESS_BACKEND_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

  # ==========================================
  # JOB 3: Deploy lên Kubernetes Cluster (Local)
  # ==========================================
  deploy-k8s:
    needs: [build-backend, build-frontend]
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Tạo/cập nhật Secret trực tiếp từ GitHub Secrets (không commit file secret vào repo)
      - name: Create backend secret
        shell: powershell
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALGORITHM: ${{ secrets.ALGORITHM }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET_KEY: ${{ secrets.CLIENT_SECRET_KEY }}
          USERS_DB_URL: ${{ secrets.USERS_DB_URL }}
          COURSES_DB_URL: ${{ secrets.COURSES_DB_URL }}
          QUIZS_DB_URL: ${{ secrets.QUIZS_DB_URL }}
          LEARNING_PROGRESS_DB_URL: ${{ secrets.LEARNING_PROGRESS_DB_URL }}
          CONFIG_DB_URL: ${{ secrets.CONFIG_DB_URL }}
          SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
          FRONTEND_HOST: ${{ secrets.NEXT_PUBLIC_FRONTEND }}
          STORAGE_API_URL: ${{ secrets.STORAGE_API_URL }}
        run: |
          kubectl create secret generic backend-secrets `
            --from-literal=SECRET_KEY="$env:SECRET_KEY" `
            --from-literal=ALGORITHM="$env:ALGORITHM" `
            --from-literal=CLIENT_ID="$env:CLIENT_ID" `
            --from-literal=CLIENT_SECRET_KEY="$env:CLIENT_SECRET_KEY" `
            --from-literal=USERS_DB_URL="$env:USERS_DB_URL" `
            --from-literal=COURSES_DB_URL="$env:COURSES_DB_URL" `
            --from-literal=QUIZS_DB_URL="$env:QUIZS_DB_URL" `
            --from-literal=LEARNING_PROGRESS_DB_URL="$env:LEARNING_PROGRESS_DB_URL" `
            --from-literal=CONFIG_DB_URL="$env:CONFIG_DB_URL" `
            --from-literal=SERVICE_TOKEN="$env:SERVICE_TOKEN" `
            --from-literal=FRONTEND_HOST="$env:FRONTEND_HOST" `
            --from-literal=BACKEND_CORS_ORIGINS="$env:FRONTEND_HOST" `
            --from-literal=STORAGE_API_URL="$env:STORAGE_API_URL" `
            --dry-run=client -o yaml | kubectl apply -f - 

      # Thay DOCKER_USER trong manifest bằng Docker Hub username thật rồi apply
      - name: Deploy Manifests
        shell: powershell
        run: |
          (Get-Content k8s/backend.yml -Raw) -replace 'DOCKER_USER', $env:DOCKER_USERNAME | kubectl apply -f -
          (Get-Content k8s/frontend.yml -Raw) -replace 'DOCKER_USER', $env:DOCKER_USERNAME | kubectl apply -f -
          (Get-Content k8s/config-service.yml -Raw) -replace 'DOCKER_USER', $env:DOCKER_USERNAME | kubectl apply -f -

          kubectl rollout restart deployment/user-service
          kubectl rollout restart deployment/course-service
          kubectl rollout restart deployment/quiz-exam-service
          kubectl rollout restart deployment/learning-progress-service
          kubectl rollout restart deployment/config-service
          kubectl rollout restart deployment/frontend