# ==========================================
# 1. PGBOUNCER CONFIG
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
data:
  pgbouncer.ini: |
    [databases]
    ; Mọi tên database (users_db, courses_db, ...) đều chuyển tiếp tới Postgres (StatefulSet "postgres" trong cluster)
    * = host=postgres port=5432

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt

    ; Gom kết nối theo từng transaction (phù hợp với psycopg2 + SQLAlchemy)
    pool_mode = transaction

    ; Số kết nối từ các service tới PgBouncer (rẻ, có thể để lớn)
    max_client_conn = 1000

    ; Số kết nối THẬT tới Postgres: tối đa 10 mỗi (user, database),
    ; và không quá 15 cho mỗi database => 5 database <= 75, dưới ngưỡng 97
    default_pool_size = 10
    max_db_connections = 15

    ; psycopg2/SQLAlchemy gửi các tham số này lúc kết nối
    ignore_startup_parameters = extra_float_digits,options
---
# ==========================================
# 2. PGBOUNCER DEPLOYMENT
# (userlist.txt nằm trong Secret pgbouncer-userlist, tạo bởi workflow)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  labels:
    app: pgbouncer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
      - name: pgbouncer
        image: edoburu/pgbouncer:latest
        ports:
        - containerPort: 6432
        volumeMounts:
        - name: config
          mountPath: /etc/pgbouncer/pgbouncer.ini
          subPath: pgbouncer.ini
          readOnly: true
        - name: userlist
          mountPath: /etc/pgbouncer/userlist.txt
          subPath: userlist.txt
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: 6432
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 6432
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: pgbouncer-config
      - name: userlist
        secret:
          secretName: pgbouncer-userlist
---
# ==========================================
# 3. PGBOUNCER SERVICE (chỉ dùng nội bộ trong cluster)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
spec:
  type: ClusterIP
  ports:
  - port: 6432
    targetPort: 6432
  selector:
    app: pgbouncer