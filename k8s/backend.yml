# ==========================================
# 1. USER-SERVICE
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: DOCKER_USER/user_service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        # URL gọi giữa các service (nội bộ k8s: tên Service + port trong container)
        - name: BACKEND_USER_URL
          value: "http://user-service:8000"
        - name: BACKEND_COURSE_URL
          value: "http://course-service:8001"
        - name: BACKEND_QUIZ_EXAM_URL
          value: "http://quiz-exam-service:8002"
        - name: BACKEND_LEARNING_PROGRESS_URL
          value: "http://learning-progress-service:8003"
        # Các biến còn lại (DB URL, SECRET_KEY, CORS, FRONTEND_HOST...) lấy từ Secret
        envFrom:
        - secretRef:
            name: backend-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30000
  selector:
    app: user-service

---
